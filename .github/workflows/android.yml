name: Android CI Build Release APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/productviewer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # Copy files
          find . -name "AndroidManifest.xml" -exec cp {} app/src/main/AndroidManifest.xml \; 2>/dev/null || true
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/example/productviewer/MainActivity.java \; 2>/dev/null || true
          find . -name "PingForegroundService.java" -exec cp {} app/src/main/java/com/example/productviewer/PingForegroundService.java \; 2>/dev/null || true
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \; 2>/dev/null || true
          find . -name "dialog_grand_sale.xml" -exec cp {} app/src/main/res/layout/dialog_grand_sale.xml \; 2>/dev/null || true
          find . -name "circle_badge_bg.xml" -exec cp {} app/src/main/res/drawable/circle_badge_bg.xml \; 2>/dev/null || true

          # Fix AndroidManifest
          sed -i 's/package=\"com.example.productviewer\"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:icon=\"@mipmap\/ic_launcher\"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon=\"@mipmap\/ic_launcher_round\"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:label=\"@string\/app_name\"/android:label=\"DiscountApp\"/g' app/src/main/AndroidManifest.xml || true

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DiscountApp</string>
          </resources>
          EOF

          # settings.gradle
          cat > settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "discount-app"
          include ':app'
          EOF

          # Root build.gradle
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # app/build.gradle
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.productviewer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.productviewer"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # gradle.properties
          cat > gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # gradle wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
