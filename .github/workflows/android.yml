name: Android CI Fixer

on:
  push:
    name: Android CI Fixer

    on:
      push:
        branches: [ main ]
      workflow_dispatch: {}

    name: Android Build

    on:
      push:
        branches: [ "main", "master" ]
      workflow_dispatch:

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Java Setup
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build APK
          run: |
            npm install -g cordova
            cordova create myapp com.example.productviewer "DiscountApp"
            cd myapp
            cordova platform add android
        
            # Files Shift
            cp -f ../AndroidManifest.xml platforms/android/app/src/main/AndroidManifest.xml || true
            cp -f ../MainActivity.java platforms/android/app/src/main/java/com/example/productviewer/MainActivity.java || true
            cp -f ../PingForegroundService.java platforms/android/app/src/main/java/com/example/productviewer/PingForegroundService.java || true
            cp -f ../activity_main.xml platforms/android/app/src/main/res/layout/activity_main.xml || true
            cp -f ../dialog_grand_sale.xml platforms/android/app/src/main/res/layout/dialog_grand_sale.xml || true
            cp -f ../circle_badge_bg.xml platforms/android/app/src/main/res/drawable/circle_badge_bg.xml || true
        
            ./platforms/android/gradlew assembleRelease

        - name: Download Link
          uses: actions/upload-artifact@v4
          with:
            name: Generated-Stealth-APK
            path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

          echo "Staging generated gradle files and any moved sources..."
          git add settings.gradle build.gradle app/build.gradle || true

          # Commit and force push only if there are changes
          if ! git diff --quiet --exit-code --cached; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git commit -m "chore(ci): regenerate Gradle files and fix Android directory structure"
            echo "Pushing fixes to origin main (force)..."
            # Use GITHUB_TOKEN via default credentials to push
            git push origin HEAD:main --force
          else
            echo "No changes to commit."
          fi

      - name: Completed
        run: echo "Auto-fix step finished. If changes were applied they have been force-pushed to origin/main."
