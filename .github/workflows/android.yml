name: Android CI Fixer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-fix-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Fix Directory Structure and Generate Gradle Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating required directories..."
          mkdir -p app/src/main/java/com/example/productviewer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          echo "Moving AndroidManifest and resources if found..."
          # Move manifest and resources into app module if present
          find . -type f -name AndroidManifest.xml -not -path './app/*' -print0 | xargs -0 -I{} bash -c 'mkdir -p app/src/main; git mv "{}" app/src/main/AndroidManifest.xml || mv "{}" app/src/main/AndroidManifest.xml || true' || true
          find . -type f -name activity_main.xml -not -path './app/*' -print0 | xargs -0 -I{} bash -c 'mkdir -p app/src/main/res/layout; git mv "{}" app/src/main/res/layout/activity_main.xml || mv "{}" app/src/main/res/layout/activity_main.xml || true' || true
          find . -type f -name dialog_grand_sale.xml -not -path './app/*' -print0 | xargs -0 -I{} bash -c 'mkdir -p app/src/main/res/layout; git mv "{}" app/src/main/res/layout/dialog_grand_sale.xml || mv "{}" app/src/main/res/layout/dialog_grand_sale.xml || true' || true
          find . -type f -name circle_badge_bg.xml -not -path './app/*' -print0 | xargs -0 -I{} bash -c 'mkdir -p app/src/main/res/drawable; git mv "{}" app/src/main/res/drawable/circle_badge_bg.xml || mv "{}" app/src/main/res/drawable/circle_badge_bg.xml || true' || true

          echo "Moving Java source files to app/src/main/java/com/example/productviewer..."
          TARGET_DIR="app/src/main/java/com/example/productviewer"
          mkdir -p "$TARGET_DIR"
          # Move tracked or untracked MainActivity.java and PingForegroundService.java
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            dest="$TARGET_DIR/$(basename "$file")"
            echo "Handling $rel -> $dest"
            if git ls-files --error-unmatch "$rel" >/dev/null 2>&1; then
              git mv "$rel" "$dest" || mv "$rel" "$dest"
            else
              mv "$rel" "$dest" || true
              git add "$dest" || true
            fi
          done < <(find . -type f \( -name 'MainActivity.java' -o -name 'PingForegroundService.java' \) -not -path './app/*' -print0)

          echo "Writing settings.gradle with proper repositories mapping..."
          cat > settings.gradle <<'SETTINGS'
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = 'discount-app'
include ':app'
SETTINGS

          echo "Writing root build.gradle with buildscript classpath for com.android.tools.build:gradle:8.1.1..."
          cat > build.gradle <<'ROOTBUILD'
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.1.1'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}
ROOTBUILD

          echo "Writing app/build.gradle with full android block and standard dependencies..."
          mkdir -p app
          cat > app/build.gradle <<'APPBUILD'
apply plugin: 'com.android.application'

android {
  namespace 'com.example.productviewer'
  compileSdk 34

  defaultConfig {
    applicationId 'com.example.productviewer'
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.9.0'
}
APPBUILD

          # Ensure proguard file exists
          mkdir -p app
          if [ ! -f app/proguard-rules.pro ]; then
            echo "# Add project specific ProGuard rules here." > app/proguard-rules.pro
            git add app/proguard-rules.pro || true
          fi

          echo "Staging generated gradle files and any moved sources..."
          git add settings.gradle build.gradle app/build.gradle || true

          # Commit and force push only if there are changes
          if ! git diff --quiet --exit-code --cached; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git commit -m "chore(ci): regenerate Gradle files and fix Android directory structure"
            echo "Pushing fixes to origin main (force)..."
            # Use GITHUB_TOKEN via default credentials to push
            git push origin HEAD:main --force
          else
            echo "No changes to commit."
          fi

      - name: Completed
        run: echo "Auto-fix step finished. If changes were applied they have been force-pushed to origin/main."
